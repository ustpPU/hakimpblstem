<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pemenang PBL STEM</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7ff;color:#172033;font:15px Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}header{background:linear-gradient(135deg,#312e81,#2563eb);color:#fff;text-align:center;padding:28px 14px}h1{margin:4px 0;font-size:clamp(23px,5vw,34px)}main{width:min(1000px,100%);padding:18px 12px 70px;margin:auto;flex:1}.card{background:#fff;border:1px solid #dbe4ff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #1e3a8a0d}.tabs{display:flex;gap:7px}.tabs button,button{border:0;border-radius:10px;padding:11px 14px;background:#4338ca;color:#fff;font-weight:bold;font:inherit;cursor:pointer}.tabs button{flex:1;background:#eef2ff;color:#3730a3}.tabs button.active{background:#4338ca;color:#fff}.award{margin:20px 0 8px;padding:8px 12px;border-radius:9px;color:#fff;font-weight:bold}.PLATINUM{background:#334155}.EMAS{background:#d97706}.PERAK{background:#64748b}.GANGSA{background:#c2410c}.members span{display:block;line-height:1.45}footer{text-align:center;background:#fff;border-top:1px solid #dbe4ff;padding:15px;color:#64748b;font-size:12px}@media(max-width:390px){main{padding:12px 8px 70px}.card{padding:13px}}
</style></head><body><header><h1>Pemenang PBL STEM</h1><b>PUICE 2026</b></header><main><div class="card"><div class="tabs" id="tabs"></div><button id="refresh" style="margin-top:12px">Muat Semula</button></div><div id="content" class="card">Memuatkan keputusan…</div></main><footer>© Unit Sumber Teknologi Pendidikan PPDPU | PUICE 2026</footer><script>const API_URL='https://script.google.com/macros/s/AKfycbzocMmfYlCYKXMsgDhHA0dgZmimIxQ-FLKCAUYTYu4VTpJVjLmYzxUOQtA5jMG9m8GY/exec';let d,cat;const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function api(){let e;for(let i=0;i<3;i++){let c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{let r=await fetch(API_URL+'?action=winners&t='+Date.now(),{signal:c.signal,cache:'no-store'}),ct=r.headers.get('content-type')||'';if(!r.ok||!ct.includes('application/json'))throw Error();return await r.json()}catch(x){e=x;await new Promise(z=>setTimeout(z,600*(i+1)))}finally{clearTimeout(t)}}throw e}function members(s){return String(s||'').split(',').map(x=>`<span>${esc(x.trim())}</span>`).join('')}function render(){let rows=d.winners[cat]||[];document.querySelector('#tabs').innerHTML=d.categories.map(x=>`<button class="${x===cat?'active':''}" data-c="${esc(x)}">${esc(x.replace('SEKOLAH ','Sekolah '))}</button>`).join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;render()});let groups=['PLATINUM','EMAS','PERAK','GANGSA'];document.querySelector('#content').innerHTML=rows.length?groups.map(g=>{let a=rows.filter(x=>x.award===g);return a.length?`<h2 class="award ${g}">${g}</h2>${a.map(x=>`<article class="card"><b>Kedudukan ${x.kedudukan}</b><h3>${esc(x.tajuk)}</h3><div class="members">${members(x.namaPeserta)}</div><p>${esc(x.sekolah)}</p></article>`).join('')}`:''}).join(''):'Keputusan belum tersedia.'}async function load(){try{d=await api();if(!d.success)throw Error();if(!d.published){document.querySelector('#content').textContent=d.message||'Keputusan belum diterbitkan.';document.querySelector('#tabs').innerHTML='';return}cat=cat||d.categories[0];render()}catch(e){document.querySelector('#content').textContent='Keputusan belum dapat dimuatkan. Sila cuba semula.'}}document.querySelector('#refresh').onclick=load;load();</script></body></html>

<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Keputusan PBL STEM</title>
  <style>
    *{box-sizing:border-box}html{overflow-x:hidden}body{margin:0;background:#edf3f8;color:#10243d;font:15px Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}header{background:#082f5c;color:#fff;text-align:center;padding:28px 14px;border-bottom:4px solid #c99513}h1{margin:4px 0;font-size:clamp(23px,5vw,34px)}main{width:min(1000px,100%);padding:18px 12px 70px;margin:auto;flex:1}.card{background:rgba(255,255,255,.84);border:1px solid #d3e0ec;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px #10243d0d}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,button{border:0;border-radius:11px;padding:12px 15px;background:#0a67b5;color:#fff;font-weight:bold;font:inherit;cursor:pointer;touch-action:manipulation}.tabs button{flex:1;min-width:170px;background:#e7f0f8;color:#153d66}.tabs button.active{background:#0a67b5;color:#fff}.status{margin:0 0 16px;padding:13px 15px;border-radius:13px;background:#e9f5ff;color:#153d66;font-weight:700}.status.complete{background:#e9f8ef;color:#16623a}.award{margin:22px 0 9px;padding:10px 13px;border-left:6px solid #0a67b5;border-radius:10px;background:#edf4fa;color:#0a315a}.entry{margin:0 0 10px}.entry h3{margin:6px 0 10px;overflow-wrap:anywhere}.rank{display:inline-block;background:#c99513;color:#fff;border-radius:999px;padding:5px 10px;font-weight:800}.members span{display:block;line-height:1.48;overflow-wrap:anywhere}.school{margin:12px 0 0;padding-top:10px;border-top:1px solid #dce6ef;color:#173f68;font-weight:800;overflow-wrap:anywhere}.empty{text-align:center;padding:26px;color:#5b6f84}.winner-strength{margin:12px 0 0;color:#40566d;font-size:13px}.decision{margin-top:14px;border-top:1px solid #dce6ef}.decision summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 2px 2px;color:#0a67b5;font-weight:800;cursor:pointer;touch-action:manipulation}.decision summary::-webkit-details-marker{display:none}.decision summary:after{content:'＋';font-size:20px}.decision[open] summary:after{content:'−'}.decision-body{padding:14px 0 2px}.domain-row{display:flex;justify-content:space-between;gap:12px;font-weight:800}.domain-track,.mini-track{height:8px;margin:8px 0 15px;border-radius:99px;background:#dce7f1;overflow:hidden}.domain-track span{display:block;height:100%;border-radius:inherit;background:#c99513}.section-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.section-score{padding:10px;border:1px solid #dbe5ee;border-radius:12px;background:#f8fbfd}.section-score.focus{border-color:#0a67b5;background:#eef7ff}.section-score b,.section-score small{display:block}.section-score small{color:#61758a;margin-top:3px}.mini-track{height:5px;margin:7px 0 0}.mini-track span{display:block;height:100%;background:#7297b8;border-radius:inherit}.section-score.focus .mini-track span{background:#0a67b5}.strength-list{margin:13px 0;padding-left:20px}.strength-list li{margin:5px 0}.justification{margin:12px 0 0;padding:13px;border-left:4px solid #c99513;border-radius:9px;background:#fff9e8;line-height:1.5}.tie-note{margin:9px 0 0;color:#5c4a12;font-size:12px;font-weight:700}footer{text-align:center;background:#082f5c;border-top:3px solid #c99513;padding:16px;color:#fff;font-size:12px}@media(max-width:390px){main{padding:12px 8px 60px}.card{padding:13px}.tabs button{min-width:0}.entry{padding:13px}.section-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>Keputusan PBL STEM</h1><b>PUICE 2026</b></header>
  <main>
    <div class="card"><div class="tabs" id="tabs"></div><button id="refresh" style="margin-top:12px">Muat Semula</button></div>
    <div id="content" class="card" aria-live="polite">Memuatkan keputusan semasa…</div>
  </main>
  <footer>© Unit Sumber Teknologi Pendidikan PPDPU | PUICE 2026</footer>
  <script>
    const API_URL='https://script.google.com/macros/s/AKfycbyYpCQAg4D0YIiN-yxasKonfQgJu562vyH7GGiTu0EOL5n357ZkxAWTH0uJlEF6l_pF/exec';
    let data,currentCategory;
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    async function api(){let lastError;for(let attempt=0;attempt<3;attempt++){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const response=await fetch(API_URL+'?action=winners&t='+Date.now(),{signal:controller.signal,cache:'no-store'}),type=response.headers.get('content-type')||'';if(!response.ok||!type.includes('application/json'))throw Error('Respons tidak sah');return await response.json()}catch(error){lastError=error;if(attempt<2)await new Promise(resolve=>setTimeout(resolve,600*(attempt+1)))}finally{clearTimeout(timer)}}throw lastError}
    function members(value){return String(value||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>'<span>'+esc(x)+'</span>').join('')}
    function decisionDetails(x,award){const summary=x.sectionSummary||{},sections=['A','B','C','D'].map(s=>{const v=summary[s]||{},focus=award.metric==='total'||award.metric===s;return '<div class="section-score '+(focus?'focus':'')+'"><b>'+esc(s+' · '+(v.label||s))+'</b><small>'+esc((v.score??0)+' / '+(v.max??0))+'</small><div class="mini-track"><span style="width:'+Math.max(0,Math.min(100,Number(v.percent)||0))+'%"></span></div></div>'}).join('');const strengths=(x.strengths||[]).map(v=>'<li>'+esc(v)+'</li>').join('');return '<p class="winner-strength"><b>Kekuatan utama:</b> '+esc((x.strengths||[]).join(' · '))+'</p><details class="decision"><summary>Lihat asas keputusan</summary><div class="decision-body"><div class="domain-row"><span>'+esc(x.awardDomain||award.domain||'Domain anugerah')+'</span><strong>'+esc(x.awardScore??0)+'%</strong></div><div class="domain-track"><span style="width:'+Math.max(0,Math.min(100,Number(x.awardScore)||0))+'%"></span></div><div class="section-grid">'+sections+'</div>'+(strengths?'<ul class="strength-list">'+strengths+'</ul>':'')+'<p class="justification">'+esc(x.justification||'Justifikasi belum tersedia.')+'</p>'+(x.tieBreak?'<p class="tie-note">'+esc(x.tieBreak)+'</p>':'')+'</div></details>'}
    function render(){const rows=data.winners[currentCategory]||[],progress=data.progress[currentCategory]||{},complete=progress.complete===true;document.querySelector('#tabs').innerHTML=data.categories.map(x=>'<button type="button" class="'+(x===currentCategory?'active':'')+'" data-category="'+esc(x)+'">'+esc(x.replace('SEKOLAH ','Sekolah '))+'</button>').join('');document.querySelectorAll('[data-category]').forEach(button=>button.onclick=()=>{currentCategory=button.dataset.category;render()});const status='<div class="status '+(complete?'complete':'')+'">'+(complete?'Keputusan penuh — semua penilaian hakim telah diterima.':'Keputusan semasa — '+(progress.received||0)+' daripada '+(progress.expected||0)+' penilaian hakim diterima. Kedudukan boleh berubah.')+'</div>';const groups=(data.awards||[]).map(award=>{const list=rows.filter(x=>x.award===award.key).sort((x,y)=>x.awardRank-y.awardRank);return list.length?'<h2 class="award">'+esc(award.label)+'</h2>'+list.map(x=>'<article class="card entry"><span class="rank">Kedudukan '+x.awardRank+'</span><h3>'+esc(x.tajuk)+'</h3><div class="members">'+members(x.namaPeserta)+'</div><p class="school">'+esc(x.sekolah)+'</p>'+decisionDetails(x,award)+'</article>').join(''):''}).join('');document.querySelector('#content').innerHTML=status+(groups||'<div class="empty">Belum ada markah bagi kategori ini.</div>')}
    async function load(){document.querySelector('#content').textContent='Memuatkan keputusan semasa…';try{data=await api();if(!data.success||!data.published)throw Error(data.message||'Keputusan belum diterbitkan.');currentCategory=currentCategory&&data.categories.includes(currentCategory)?currentCategory:data.categories[0];render()}catch(error){document.querySelector('#content').textContent=error.message||'Keputusan belum dapat dimuatkan. Sila cuba semula.'}}
    document.querySelector('#refresh').onclick=load;load();
  </script>
</body>
</html>
